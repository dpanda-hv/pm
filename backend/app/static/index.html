<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM MVP Hello</title>
    <style>
      :root {
        --accent-yellow: #ecad0a;
        --primary-blue: #209dd7;
        --secondary-purple: #753991;
        --navy-dark: #032147;
        --gray-text: #888888;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(145deg, #f7f9ff, #eef4ff);
        color: var(--navy-dark);
      }

      main {
        width: min(680px, 92vw);
        border: 1px solid rgba(3, 33, 71, 0.1);
        border-radius: 20px;
        padding: 24px;
        background: white;
        box-shadow: 0 20px 40px rgba(3, 33, 71, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      p {
        color: var(--gray-text);
      }

      .result {
        margin-top: 20px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid rgba(32, 157, 215, 0.24);
        background: rgba(32, 157, 215, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from PM MVP scaffolding</h1>
      <p>This static page is served by FastAPI at <strong>/</strong>.</p>
      <div class="result" id="result">Calling /api/hello ...</div>
    </main>
    <script>
      const result = document.getElementById("result");
      fetch("/api/hello")
        .then((response) => response.json())
        .then((data) => {
          result.textContent = "API says: " + (data.message || "No message");
        })
        .catch(() => {
          result.textContent = "API call failed.";
        });
    </script>
  </body>
</html>
